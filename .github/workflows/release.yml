name: Android release

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      apk_name: ${{ steps.metadata.outputs.apk_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only release commits already integrated into main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate tag and compute Android version
        id: metadata
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          python3 scripts/release_metadata.py "$RELEASE_TAG" --previous-tag "$previous_tag" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install the exact Android SDK used by the project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify release version rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build release and run Android checks
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          chmod +x gradlew
          options=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            options+=("-PreleaseVersionName=$RELEASE_VERSION" "-PreleaseVersionCode=$RELEASE_VERSION_CODE")
          fi
          ./gradlew "${options[@]}" :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Transfer the verified unsigned APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign APK and publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.build.outputs.version_code }}
      APK_NAME: ${{ needs.build.outputs.apk_name }}
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk-${{ github.sha }}
          path: unsigned
      - name: Install Android signing tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'"
      - name: Sign with the existing FindMe certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/findme-signing.keystore"
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/findme-signing.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --v4-signing-enabled false \
            --out "dist/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "dist/$APK_NAME"
          "$tools/zipalign" -c -P 16 4 "dist/$APK_NAME"
          "$tools/aapt" dump badging "dist/$APK_NAME" > "$RUNNER_TEMP/apk-metadata.txt"
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-metadata.txt').read_text()
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", text).groups()
          assert package == ('com.example.findme', os.environ['RELEASE_VERSION_CODE'], os.environ['RELEASE_VERSION'])
          assert 'application-debuggable' not in text
          PY
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
      - name: Publish a complete release without patch notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "A published release cannot be overwritten; use a new tag."' "$RUNNER_TEMP/release.json"
          else
            if ! grep -qi 'release not found' "$RUNNER_TEMP/release-error.txt"; then
              cat "$RUNNER_TEMP/release-error.txt" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag   \
            --target "$GITHUB_SHA" --title "FindMe $RELEASE_VERSION"   \
            --notes "Actualización de FindMe $RELEASE_VERSION." --draft
          fi
          gh release upload "$RELEASE_TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          echo "Release published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/findme-signing.keystore"
